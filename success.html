<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Complete — ScreeTC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b12;
            --bg-card: #0e1520;
            --border: #1e2a3a;
            --cyan: #2dd4bf;
            --emerald: #10b981;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(16, 185, 129, 0.14), transparent 55%);
            pointer-events: none;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 18px rgba(45, 212, 191, 0.4));
        }

        .check {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            color: var(--emerald);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: var(--cyan);
        }

        p {
            color: var(--text-muted);
            font-size: 0.98rem;
            margin-bottom: 14px;
            line-height: 1.55;
        }

        code.block {
            display: block;
            background: #0a1018;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--cyan);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            margin: 18px 0;
        }

        code.inline {
            display: inline;
            background: #0a1018;
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--cyan);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
        }

        .session {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding: 12px 28px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            color: #04120c;
            background: linear-gradient(135deg, #2dd4bf 0%, #10b981 100%);
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.3);
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/logo.jpg" alt="ScreeTC" width="72" height="72">
        <div class="check" aria-hidden="true">✓</div>
        <h1>Payment Configuration Complete</h1>
        <p>
            Your billing account is linked to the <strong style="color:#e2e8f0">ScreeTC</strong> pricing engine.
            Settlement is handled securely by Stripe.
        </p>
        <p>
            Use your Stripe Customer ID as <code class="inline">customer_stripe_id</code> when calling the
            <code class="inline">/v1/flow</code> telemetry API.
        </p>
        <p class="session" id="session-info"></p>
        <a class="btn" href="/">← Return to Gateway</a>
    </div>
    <script>
        const sid = new URLSearchParams(window.location.search).get('session_id');
        if (sid) {
            document.getElementById('session-info').textContent =
                'Checkout session: ' + sid;
        }
    </script>
</body>
</html>
