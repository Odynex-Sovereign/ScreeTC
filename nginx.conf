events { worker_connections 1024; }

http {
    upstream triton_http_backend {
        server screetc-inference-core:8000;
    }

    upstream triton_grpc_backend {
        server screetc-inference-core:8001;
    }

    server {
        listen 443 ssl http2;
        server_name api.odynexaxis.cloud;

        # Production SSL Encryption Configurations (Point to volumes managed via Certbot)
        ssl_certificate /etc/letsencrypt/live/api.odynexaxis.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.odynexaxis.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Operational Rate Limiting Layer to prevent Multi-Tenant API exhaustion
        client_max_body_size 50M;

        # Standard REST API Route Proxy Mapping
        location /v1/flow {
            proxy_pass http://triton_http_backend/v1/models/screetc_pinn/versions/1/infer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optimized gRPC Stream Routing Pipeline for high-frequency Logistics edge tracking
        location / {
            grpc_pass grpc://triton_grpc_backend;
            error_page 502 = /error502grpc;
        }

        location = /error502grpc {
            internal;
            default_type application/grpc;
            add_header grpc-status 14; # Unavailable / Network Drop status
            add_header grpc-message "Odynex Axis Telemetry Gateway Node Unreachable";
            return 204;
        }
    }
}
