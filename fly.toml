app = "screetc"
primary_region = "iad" # Replace with your chosen GPU-capable edge region

[build]
  dockerfile = "Dockerfile"

[vm]
  size = "a10g"         # Provisions an NVIDIA A10G Tensor Core GPU
  memory = "16gb"       # Allocates system memory for large AI model weights
  cpus = 4

[[services]]
  internal_port = 8000  # The port main_api_gateway.py listens on
  protocol = "tcp"

  [services.concurrency]
    groups = "app"
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  # Terminate HTTPS/TLS traffic at the Fly Edge and route to your API gateway
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # Accept standard HTTP traffic and force upgrade it to secure HTTPS
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  # TCP health check to verify your physics orchestration engine is alive
  [[services.tcp_checks]]
    grace_period = "30s" # Gives the heavy NVIDIA runtime ample time to boot up
    interval = "15s"
    timeout= "5s"
